<!DOCTYPE html>
<html lang="en" data-i18n-page="home" data-i18n-base="/shared/i18n/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueTapp</title>
    <meta name="description" content="TrueTapp — Apps that turn moments into experiences.">
    <link rel="stylesheet" href="/shared/css/base.css">
    <style>
        html, body { height: 100%; overflow: hidden; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .tt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        .logo-text {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-tertiary);
            letter-spacing: 0.02em;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--glass-stroke);
        }

        .apps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .app-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            background: var(--glass-fill);
            border: 1px solid var(--glass-stroke);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .app-link:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .app-link .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-snapsong {
            background: linear-gradient(135deg, var(--primary-red), var(--accent-orange));
        }

        .tt-footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="ambient"></div>

    <div class="tt-container">
        <div class="logo-text">TrueTapp</div>
        <div class="tagline" data-i18n="truetapp.tagline">Apps that turn moments into experiences</div>
        <div class="divider"></div>
        <div class="apps">
            <a href="snapsong/" class="app-link">
                <span class="dot dot-snapsong"></span>
                SnapSong
            </a>
        </div>
    </div>

    <div class="tt-footer">
        <span>&copy; 2026 TrueTapp</span>
        <span id="lang-switcher-mount"></span>
    </div>

    <script src="/shared/js/i18n.js"></script>
</body>
</html>
