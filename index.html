<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueTapp</title>
    <meta name="description" content="TrueTapp — Apps que transformam momentos em experiências.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0A;
            color: #fff;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        .logo-text {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.02em;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.15);
        }

        .apps {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .app-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .app-link:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .app-link .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-snapsong {
            background: linear-gradient(135deg, #FF002E, #FF6B35);
        }

        .footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">TrueTapp</div>
        <div class="tagline">Em breve</div>
        <div class="divider"></div>
        <div class="apps">
            <a href="snapsong/" class="app-link">
                <span class="dot dot-snapsong"></span>
                SnapSong
            </a>
        </div>
    </div>
    <div class="footer">&copy; 2026 TrueTapp</div>
</body>
</html>
