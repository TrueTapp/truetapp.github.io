<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <!-- Origami T icon -->
  <g transform="translate(0, 5)">
    <polygon points="10,0 40,0 30,35 0,35" fill="#E05A00"/>
    <polygon points="40,0 70,0 70,35 30,35" fill="#FF6B35"/>
    <polygon points="30,35 50,35 50,88 30,88" fill="#FF8F5A"/>
    <polygon points="50,35 70,35 70,55 50,55" fill="#FFB347"/>
    <polygon points="30,35 40,0 40,35" fill="#CC4E00" opacity="0.3"/>
  </g>

  <!-- "trueTapp" as individual letters for reliable rendering -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-weight="700" font-size="46" letter-spacing="-1">
    <text x="84" y="58" fill="white">true</text>
    <text x="192" y="58" fill="#FF6B35">T</text>
    <text x="218" y="58" fill="white">app</text>
  </g>

  <!-- "Mobile Apps" subtitle -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-weight="300" font-size="20" letter-spacing="1.5">
    <text x="86" y="82" fill="rgba(255,255,255,0.4)">Mobile Apps</text>
  </g>
</svg>
